<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaushalya Karnataka | Interactive Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
    <style>
        /* Including your exact CSS for the phone simulation */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: #f1f5f9; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }

        .web-header { text-align: center; margin-bottom: 30px; }
        .web-header h1 { color: #1e293b; font-size: 2rem; }
        .web-header p { color: #64748b; margin-top: 8px; }

        .phone-frame {
            width: 360px;
            background: #fff;
            border-radius: 30px;
            border: 8px solid #1e293b;
            overflow: hidden;
            height: 740px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            position: relative;
        }

        /* Your App Styles */
        .status-bar { background: #f97316; color: white; font-size: 11px; padding: 6px 16px; display: flex; justify-content: space-between; align-items: center; }
        .nav-bar { background: #f97316; color: white; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
        .nav-bar h1 { font-size: 16px; font-weight: 500; flex: 1; }
        .screen { display: none; height: calc(100% - 100px); overflow-y: auto; }
        .screen.active { display: block; }
        .search-bar { padding: 10px 12px; background: #f8fafc; border-bottom: 0.5px solid #e2e8f0; }
        .search-bar input { width: 100%; font-size: 13px; padding: 8px 12px; border-radius: 10px; border: 1px solid #e2e8f0; }
        .filter-scroll { display: flex; gap: 6px; padding: 10px 12px; overflow-x: auto; background: #fff; border-bottom: 0.5px solid #e2e8f0; scrollbar-width: none; }
        .filter-chip { white-space: nowrap; font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1px solid #e2e8f0; cursor: pointer; color: #64748b; }
        .filter-chip.selected { background: #f97316; color: white; border-color: #f97316; }
        .worker-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 12px; margin: 10px 12px; cursor: pointer; transition: 0.2s; }
        .worker-card:hover { border-color: #f97316; transform: scale(1.02); }
        .avatar { width: 44px; height: 44px; border-radius: 50%; background: #fff7ed; border: 1.5px solid #fed7aa; display: flex; align-items: center; justify-content: center; color: #c2410c; }
        .worker-role { font-size: 11px; color: white; background: #f97316; padding: 2px 8px; border-radius: 20px; margin: 4px 0; display: inline-block; }
        .verified-badge { font-size: 11px; color: #15803d; background: #dcfce7; padding: 2px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 3px; }
        .services-preview { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #f1f5f9; }
        .service-tag { font-size: 10px; background: #f8fafc; border: 1px solid #e2e8f0; padding: 2px 6px; border-radius: 6px; color: #64748b; }
        .bottom-nav { position: absolute; bottom: 0; width: 100%; background: #fff; border-top: 1px solid #e2e8f0; display: flex; padding: 10px 0; }
        .nav-item { flex: 1; text-align: center; font-size: 10px; color: #64748b; cursor: pointer; }
        .nav-item i { font-size: 22px; display: block; }
        .nav-item.active { color: #f97316; }
        .stat-box { flex: 1; background: #f8fafc; border-radius: 10px; padding: 10px; text-align: center; border: 1px solid #e2e8f0; }
        .hire-btn { width: calc(100% - 24px); margin: 16px 12px; background: #f97316; color: white; border: none; border-radius: 12px; padding: 14px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="web-header">
        <h1>Kaushalya Karnataka</h1>
        <p>Interactive App Preview. Click to explore our features.</p>
    </div>

    <div class="phone-frame" id="app">
        <div class="status-bar">
            <span>9:41</span>
            <span>ಕೌಶಲ್ಯ ಕರ್ನಾಟಕ</span>
            <span>📶 🔋</span>
        </div>

        <div id="screen-home" class="screen active">
            <div class="nav-bar"><h1>Home</h1></div>
            <div class="search-bar"><input type="text" placeholder="Search experts..."></div>
            <div class="filter-scroll">
                <div class="filter-chip selected">All</div>
                <div class="filter-chip">Electrician</div>
                <div class="filter-chip">Plumber</div>
                <div class="filter-chip">Tailor</div>
            </div>
            <div id="workerList">
                <!-- Workers injected by JS -->
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active"><i class="ti ti-home"></i>Home</div>
            <div class="nav-item"><i class="ti ti-plus"></i>Register</div>
            <div class="nav-item"><i class="ti ti-user"></i>Profile</div>
        </div>
    </div>

    <script>
        const workers = [
            { id: 1, name: "Raju Kumar", initials: "RK", role: "Electrician", location: "Hubli", rating: 4.8, jobs: 156, services: ["Fan Repair", "Wiring"] },
            { id: 2, name: "Lakshmi Devi", initials: "LD", role: "Tailor", location: "Dharwad", rating: 4.9, jobs: 89, services: ["Blouse Stitching", "Alterations"] }
        ];

        function render() {
            const list = document.getElementById('workerList');
            list.innerHTML = workers.map(w => `
                <div class="worker-card">
                    <div style="display:flex; gap:12px;">
                        <div class="avatar">${w.initials}</div>
                        <div style="flex:1">
                            <div style="font-weight:600">${w.name}</div>
                            <div class="worker-role">${w.role}</div>
                            <div style="font-size:12px; color:#64748b">📍 ${w.location}</div>
                            <div class="verified-badge">✔ Verified</div>
                        </div>
                        <div style="text-align:right">
                            <div style="color:#f97316">★ ${w.rating}</div>
                            <div style="font-size:11px; color:#64748b">${w.jobs} jobs</div>
                        </div>
                    </div>
                    <div class="services-preview">
                        ${w.services.map(s => `<span class="service-tag">${s}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }
        render();
    </script>
</body>
</html>
